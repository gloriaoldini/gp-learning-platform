<style>
:root{--ink:#1C2321;--ink-2:#4A5551;--line:#D9DEDB;--border:#8A9490;--bg:#F5F6F3;--surface:#FFFFFF;--accent:#007A79;--accent-dark:#005958;--accent-light:#E6F6F6;--brand:#009D9C;--brand-2:#E95500;--warn-bg:#FDF0E8;--warn-line:#FAD9C4;--warn-ink:#B84300;--scrim:rgba(28,35,33,.55);--display:"Lexend",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;--r-sm:8px;--r:12px;--r-lg:16px;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.app{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:1024px){.app.is-login{grid-template-columns:minmax(420px,44%) minmax(0,1fr)}}
.brand{display:none}
@media (min-width:1024px){.brand{display:flex;flex-direction:column;justify-content:space-between;gap:48px;background:var(--accent-light);padding:48px 64px}}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:600;font-size:20px}
.logo-mark{width:40px;height:40px;border-radius:var(--r);background:var(--brand);display:grid;place-items:center;flex-shrink:0}
.logo-mark svg{width:60%;height:60%}
.brand h2{font-size:44px;line-height:1.18;max-width:12em}
.brand .lead{font-size:20px;color:var(--ink-2);margin-top:16px;max-width:26em}
.features{list-style:none;margin:40px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;max-width:420px}
.features li{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--surface);border-radius:var(--r-lg);font-family:var(--display);font-weight:500;font-size:20px}
.f-icon{width:44px;height:44px;border-radius:var(--r);background:var(--brand);color:#fff;display:grid;place-items:center;flex-shrink:0}
.side{display:flex;flex-direction:column;min-height:100%;background:var(--surface)}
@media (min-width:600px) and (max-width:1023px){.side{background:var(--bg)}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
@media (min-width:600px){.topbar{padding:24px 40px;border-bottom:0}}
@media (min-width:1024px){.topbar{justify-content:flex-end;padding:32px 48px 0}.app.is-login .topbar .logo{display:none}.app:not(.is-login) .topbar{justify-content:space-between;padding:20px 48px;border-bottom:1px solid var(--line)}}
@media (max-width:599px){.topbar .logo{font-size:16px}.topbar .logo-mark{width:32px;height:32px;border-radius:10px}}
.langs{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.langs button{min-width:44px;height:44px;padding:0 6px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-2);font-size:16px;cursor:pointer}
@media (min-width:600px){.langs button{min-width:52px}}
.langs button:hover{background:var(--bg)}
.langs button[aria-pressed="true"]{background:var(--accent-light);color:var(--accent-dark);font-weight:700}
.main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:32px 24px 24px}
@media (min-width:600px){.main{align-items:center;padding:24px 40px}}
.panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:32px}
@media (min-width:600px) and (max-width:1023px){.panel{max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:48px}}
.heading{display:flex;flex-direction:column;gap:8px}
.heading h1{font-size:32px;line-height:1.25}
@media (min-width:600px){.heading h1{font-size:36px}}
@media (min-width:1024px){.heading h1{font-size:40px}}
.heading .sub{font-size:20px}
.heading .helper{font-size:16px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:56px;padding:0 28px;border:0;border-radius:var(--r);background:var(--accent);color:#fff;font-family:var(--display);font-weight:500;font-size:18px;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--accent-dark)}
.btn[disabled]{background:var(--accent-dark);cursor:progress}
.btn.block{width:100%}
.btn.secondary{background:var(--surface);color:var(--accent);border:2px solid var(--accent)}
.btn.secondary:hover{background:var(--accent-light)}
.signin{display:flex;flex-direction:column;gap:12px}
.flabel{font-size:16px;font-weight:700}
#email{height:56px;width:100%;padding:0 16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;font-size:18px}
#email:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#email[aria-invalid="true"]{border:2px solid #B3261E}
.ferr{font-size:16px;font-weight:700;color:#B3261E}
.hint2{display:flex;gap:8px;font-size:16px;color:var(--ink-2)}
.hint2 svg{flex-shrink:0;margin-top:5px}
.okline{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r);background:var(--accent-light);color:var(--accent-dark);font-weight:700}
.linkbtn.small{font-size:15px;font-weight:400;color:var(--ink-2);min-height:44px;margin-top:-8px}
.picker{display:flex;flex-direction:column;gap:12px}
.pick{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 16px;border:2px solid var(--accent);border-radius:var(--r);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
.pick:hover{background:var(--accent-light)}
.pick>svg{flex-shrink:0;color:var(--accent)}
.pick-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.picker .row .linkbtn.small{margin-top:0}
.step{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-dark)}
.chip{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-light);color:var(--accent-dark);display:grid;place-items:center;flex-shrink:0}
.chip-txt{min-width:0}.chip-l{font-size:14px;color:var(--ink-2)}.chip-e{font-weight:700;overflow-wrap:anywhere}
.ms-box{display:flex;gap:12px;padding:20px;border:2px dashed var(--border);border-radius:var(--r);background:var(--bg);font-size:16px;color:var(--ink-2)}
.ms-box svg{flex-shrink:0;color:var(--ink-2)}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}dialog[open]{animation:none!important}}
.callout{display:flex;gap:16px;padding:20px;border-radius:var(--r);background:var(--bg);border:1px solid var(--line)}
.callout svg{flex-shrink:0;margin-top:2px}
.callout .t{font-weight:700}
.callout .b{font-size:16px;color:var(--ink-2)}
.callout.warn{background:var(--warn-bg);border-color:var(--warn-line);padding-right:8px}
.callout.warn .b{color:var(--ink)}
.callout .txt{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.icon-btn{width:44px;height:44px;flex-shrink:0;margin-top:-10px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:rgba(28,35,33,.06)}
.linkbtn{align-self:flex-start;min-height:44px;padding:0;border:0;background:none;display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.linkbtn:hover{color:var(--accent-dark)}
.linkbtn svg{transition:transform .15s}
.linkbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.helpbox{margin-top:8px;padding:16px 20px;border:1px dashed var(--border);border-radius:var(--r);font-size:16px;color:var(--ink-2)}
.footer{display:flex;justify-content:center;padding:8px 24px 24px}
@media (min-width:1024px){.footer{justify-content:flex-end;margin:0 48px;padding:8px 0 24px;border-top:1px solid var(--line)}}
.footer .linkbtn{font-weight:400;font-size:16px;color:var(--ink-2);text-underline-offset:3px}
dialog{border:0;padding:32px;border-radius:var(--r-lg);width:min(600px,calc(100% - 32px));max-height:min(760px,calc(100% - 48px));background:var(--surface);color:var(--ink);box-shadow:0 24px 48px rgba(28,35,33,.25)}
dialog::backdrop{background:var(--scrim)}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.d-head h2{font-size:24px;line-height:1.33}
.d-body{display:flex;flex-direction:column;gap:16px;font-size:17px}
.d-foot{display:flex;justify-content:flex-end;margin-top:24px}
.grab{display:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
@media (max-width:599px){
  dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:20px 20px 0 0;padding:12px 24px 24px;max-height:90%}
  dialog[open]{animation:sheet .2s ease-out}
  dialog .grab{display:block}
  .d-head h2{font-size:22px}
  .d-body{font-size:16px}
  .d-foot .btn{width:100%}
}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.home{width:100%;max-width:640px;display:flex;flex-direction:column;gap:24px}
.placeholder{border:2px dashed var(--border);border-radius:var(--r-lg);padding:40px 24px;text-align:center;color:var(--ink-2);font-size:18px}
.timer{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--ink-2)}
.timer strong{color:var(--ink);font-variant-numeric:tabular-nums}
.proto-tag{align-self:flex-start;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-dark);background:var(--accent-light);padding:4px 10px;border-radius:999px;font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap}
.main.help-main{align-items:flex-start}
.help{width:100%;max-width:760px;display:flex;flex-direction:column;gap:28px;padding-bottom:24px}
.help .muted{color:var(--ink-2)}
.help .ph{color:var(--ink-2);font-size:15px}
.infoline{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;background:var(--accent-light);border-radius:var(--r);font-size:17px}
.infoline svg{flex-shrink:0;margin-top:2px}
.faq-wrap h2{font-size:24px;margin-bottom:12px}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;min-height:64px;padding:16px 8px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-family:var(--display);font-weight:500;font-size:18px}
@media (min-width:600px){.faq summary{font-size:19px}}
.faq summary::-webkit-details-marker{display:none}
.faq summary:hover{background:var(--bg)}
.faq summary svg{flex-shrink:0;transition:transform .15s}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq .ans{padding:0 8px 24px;font-size:17px;display:flex;flex-direction:column;gap:12px}
.faq ol,.faq ul{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px}
.faq .strong{font-weight:700}
.opts{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:600px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{padding:20px;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:6px;font-size:16px}
.opt .ot{font-family:var(--display);font-weight:600;font-size:18px}
.cta{align-self:flex-start;height:52px;padding:0 24px;border-radius:var(--r);background:var(--accent);color:#fff;font-family:var(--display);font-weight:500;font-size:17px;display:inline-flex;align-items:center;border:0;cursor:pointer}
.cta:hover{background:var(--accent-dark)}
.last{padding:24px;border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;gap:16px;align-items:flex-start}
@media (min-width:600px){.last{flex-direction:row;padding:28px;gap:20px}}
.last .pin{width:48px;height:48px;flex-shrink:0;border-radius:var(--r);background:var(--accent-light);color:var(--accent);display:grid;place-items:center}
.last h2{font-size:22px}
.last .txt{display:flex;flex-direction:column;gap:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tip{background:var(--accent-light);border-radius:var(--r);padding:12px 16px}
a.ext{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
a.ext:hover{color:var(--accent-dark)}
a.ext svg{flex-shrink:0}
a.cta{text-decoration:none;gap:10px}
.faq ul.linklist{list-style:none;padding-left:0;gap:0}
.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;font-size:16px}
.card .ct{font-family:var(--display);font-weight:600;font-size:18px}
.card ol,.card ul{font-size:16px}
.warnline{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:8px 12px;font-weight:700}
.card .xt{font-weight:700;margin-top:4px}
.links-sec h2{font-size:22px;margin-bottom:8px}
.hl{list-style:none;margin:0 0 8px;padding:0;border-top:1px solid var(--line)}
.hl li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:52px;border-bottom:1px solid var(--line);padding:4px 0}
.hl .hl-label{font-weight:700}
.dash{min-height:100%;background:var(--bg);display:flex;flex-direction:column}
.d-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
@media (min-width:600px){.d-top{padding:14px 32px}}
@media (min-width:1024px){.d-top{padding:12px 48px;gap:32px}}
.d-top .logo{font-size:18px}
@media (max-width:599px){.d-top .logo{font-size:16px}.d-top .logo-mark{width:32px;height:32px;border-radius:10px}}
.d-nav{display:none}
@media (min-width:1024px){.d-nav{display:flex;gap:4px}}
.d-nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:var(--r-sm);color:var(--ink);text-decoration:none;font-family:var(--display);font-weight:500;font-size:17px}
.d-nav a:hover{background:var(--bg)}
.d-nav a[aria-current="page"]{background:var(--accent-light);color:var(--accent-dark)}
.d-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-light);color:var(--accent-dark);display:grid;place-items:center;cursor:pointer}
.avatar-btn:hover{background:var(--accent-100,#C7EBEA)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:52px;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(28,35,33,.18);padding:8px;display:flex;flex-direction:column;z-index:30}

.menu button:hover{background:var(--bg)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.d-main{width:100%;max-width:1280px;margin:0 auto;padding:24px 16px 112px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:600px){.d-main{padding:32px 32px 120px;gap:24px}}
@media (min-width:1024px){.d-main{grid-template-columns:minmax(0,1fr) 400px;padding:40px 48px 56px;gap:32px;align-items:start}}
.col{display:contents}
@media (min-width:1024px){.col{display:flex;flex-direction:column;gap:24px;min-width:0}}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}
.greet h1{font-size:30px;line-height:1.2}
@media (min-width:600px){.greet h1{font-size:36px}}
.greet p{color:var(--ink-2);margin-top:4px;font-size:18px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:600px){.box{padding:24px}}

.box-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink-2)}
.small{font-size:16px}

.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}

.theme-dark .ex-ok{background:#16352A;color:#9BE0B0}.theme-dark .ex-no{background:#3A1E1C;color:#F2B8B5}
.theme-dark .ex-pdf{background:#1E2725;color:#E6ECEA}.theme-dark .ex-pdf span{background:#33403D}
@media (max-width:599px){.ex-wrap{align-items:flex-end;padding:0}.ex-dlg{border-radius:20px 20px 0 0;max-height:90vh}}

img.logo-mark{background:transparent!important;border-radius:0!important;object-fit:contain;display:block}

/* calm everywhere (v2) */
.callout .t{font-family:var(--display);font-weight:500}
.callout.warn{background:#FDF0E8;border-color:#FAD9C4}
.linkbtn{font-weight:400}
a.ext{font-weight:400}
.hl .hl-label{font-family:var(--display);font-weight:500}
.warnline{font-weight:400;background:#FDF0E8;border-color:#FAD9C4;color:var(--warn-ink)}
.card .xt,.faq .strong{font-family:var(--display);font-weight:500}
.okline{font-weight:400}
.step{font-weight:400}
</style>
